id: modulo_swapped_args
title: "modulo() returns the wrong remainder"
description: |
  modulo(10, 3) returns 3, but 10 divided by 3 leaves a remainder of 1, not 3.

  modulo(7, 2) also comes back wrong — it returns 2 instead of 1.
fixture_repo: demo/sample_repos/calculator
target_file: calculator/calc.py
verify_command: "pytest calculator/test_calc.py::test_modulo -v"
difficulty: trivial
